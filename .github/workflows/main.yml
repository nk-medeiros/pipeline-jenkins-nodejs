name: Node.js CI/CD Pipeline with SAST & DAST

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    # Bloco de permissões
    permissions:
      contents: read
      issues: write
      checks: write

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Step: Install
      - name: Install Dependencies
        run: npm ci

      # 4. SAST - Semgrep
      - name: SAST - Semgrep Scan
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config=p/javascript --config=p/nodejs \
            --sarif --output=semgrep.sarif
        continue-on-error: true

      - name: Upload relatório SAST
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast
          path: semgrep.sarif

      # 5. Step: Build
      - name: Build
        run: npm run build --if-present

      # 6. Step: Test
      - name: Run Tests
        run: npm test

      # 7. Docker Build - constrói a imagem da aplicação
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build
        run: docker build -t pipeline-jenkins-nodejs:${{ github.sha }} .

      # 8. Subir o container para validação e DAST
      - name: Start Container for DAST
        run: |
          docker run -d -p 3000:3000 --name app pipeline-jenkins-nodejs:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "Aplicação respondeu na tentativa $i"
              exit 0
            fi
            echo "Aguardando aplicação... tentativa $i"
            sleep 3
          done
          echo "Aplicação não respondeu. Logs do container:"
          docker logs app
          exit 1

      # 9. DAST - OWASP ZAP (via docker run, evita bug de upload de artifact da action oficial)
      - name: DAST - OWASP ZAP Baseline Scan
        run: |
          docker run --rm --network="host" \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000 -r zap_report.html -J zap_report.json -I
        continue-on-error: true

      - name: Upload relatório DAST
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast
          path: |
            zap_report.html
            zap_report.json

      # 10. Limpeza - derruba o container mesmo se algo falhar
      - name: Stop Container
        if: always()
        run: docker stop app && docker rm app || true