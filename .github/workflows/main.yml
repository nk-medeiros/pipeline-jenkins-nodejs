name: Node.js CI/CD Pipeline with SAST & DAST

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    # Bloco de permissões
    permissions:
      contents: read
      issues: write
      checks: write

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm''

      # 3. Step: Install
      - name: Install Dependencies
        run: npm ci

      # 4. SAST - Semgrep
      - name: SAST - Semgrep Scan
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config=p/javascript --config=p/nodejs \
            --sarif --output=semgrep.sarif
        continue-on-error: true

      - name: Upload relatório SAST
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast
          path: semgrep.sarif

      # 5. Step: Build
      - name: Build
        run: npm run build --if-present

      # 6. Step: Test
      - name: Run Tests
        run: npm test

      # 7. Subir a aplicação em segundo plano para o DAST
      - name: Start Application for DAST
        run: |
          npm start &
          sleep 10
          curl --retry 10 --retry-delay 3 --retry-connrefused http://127.0.0.1:3000

      # 8. DAST - OWASP ZAP
      - name: DAST - OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://172.17.0.1:3000'
          allow_issue_writing: false
          fail_action: false


          
